[pytest]
testpaths = tests
addopts = -ra --strict-markers
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
filterwarnings =
    default::UserWarning
markers =
    api(service, method, path): связь теста с эндпоинтом OpenAPI (ставится через framework.endpoint)
    smoke: быстрые критичные проверки (запуск на каждый деплой)
    destructive: создаёт неудаляемые сущности / влияет на лицензии; только при ALLOW_DESTRUCTIVE=true
    second_user: нужен второй пользователь (SECOND_USER_LOGIN/PASSWORD)
    selftest: тесты самого фреймворка (без стенда)
    generated: тест написан агентом и ещё не прошёл ревью человека
    user_pool_mutation: создаёт/удаляет пользователей в Cognito (запрещено на окружениях с прод-юзерпулом)
    release_check: сверка данных стенда до/после релиза (нужен LAYOUT_BASELINE_FILE)
