# Окружения API-автотестов. Структура совпадает с config.yaml фронтовых автотестов.
#
# !!! В этом файле НЕТ секретов — он коммитится. Секреты задаются переменными окружения
#     (GitLab CI/CD variables или локальный .env), имена указаны в комментариях `# env:`.
#     Вложенные поля переопределяются через "__": COGNITO__SECRET_KEY, LICENSE_SERVER__API_URL ...
#
# Выбор окружения: TEST_ENV=<ключ верхнего уровня> (по умолчанию alphatest1).
# Блок `api_tests` — параметры, специфичные для API-тестов (компания, маршрутизация, prod-защита).

gitlab:
  host: "https://gitlab.dev.metapixai.com/"
  # private_token  -> env: GITLAB_API_TOKEN

# _default_pwd -> env: TEST_USER_PASSWORD
requests_timeout:   # (connect, read) секунд — передаётся в requests как кортеж
  - 10
  - 20

mailinator: {}      # token -> env: MAILINATOR_TOKEN

DWNX:
  email: vbelyaev@metapix.ai
  name: "Vyacheslav Belyaev"
  # password -> env: DWNX__PASSWORD

alphatest1: &dev_env
  name: alphatest1
  url: https://api.alphatest1.dev.metapixai.com
  web_url: https://app.alphatest1.dev.metapixai.com
  cognito:
    region_name: "eu-central-1"
    user_pool_id: "eu-central-1_aC5Szk1rB"
    app_id: "6rgoapu5kusb85fb59mepqd759"
    # access_key -> env: COGNITO__ACCESS_KEY ; secret_key -> env: COGNITO__SECRET_KEY
  license_server:
    web_url: https://app.dev.licensing.dev.metapixai.com/
    api_url: https://api.dev.licensing.dev.metapixai.com
    service_provider: autotest@metapix.ai
    integrator: integrator3@metapixteam.testinator.com
  service_provider:
    company_name_cpo: Metapix CPO
    company_name_euo: Metapix EUO
    company_name_integrator: Integrator Test Company CPO
    email: autotest@metapix.ai
  api_tests:
    routing: gateway
    company_id: 10055          # «Maxim Rasulzoda» — изолированная компания тестового пользователя
    production: false

